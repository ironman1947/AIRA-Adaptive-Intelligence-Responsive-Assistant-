[theme]
base = "dark"
primaryColor = "#00F0FF"
backgroundColor = "#070A12"
secondaryBackgroundColor = "#0F1626"
textColor = "#F1F5F9"
font = "sans serif"
borderColor = "#1E293B"
baseRadius = "0.75rem"
buttonRadius = "0.5rem"
showWidgetBorder = true
showSidebarBorder = true

[theme.sidebar]
backgroundColor = "#060911"
secondaryBackgroundColor = "#0C1220"
textColor = "#E2E8F0"
borderColor = "#172033"
primaryColor = "#00F0FF"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
maxUploadSize = 50
